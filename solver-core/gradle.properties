# The library's version. Bump it whenever solver-core changes in a way consumers can see (public API,
# planning behaviour). Major = breaking API change: consumers bundle it with a [x.y.z, nextMajor) range.
# See docs/solver-library.md.
solver_version=2.2.0

# Standalone runs (./gradlew -p solver-core ...) read THIS file, not the root one: no lingering daemon,
# same as every build that includes solver-core. Standalone runs write plain build/; an including build
# writes build/<its name>/ (see build.gradle.kts), so they no longer share a jar a daemon could lock.
org.gradle.daemon=false
org.gradle.caching=true
