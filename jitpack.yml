# JitPack publishes ONLY the solver library (solver-core/, com.legoj15:solver), not the mod builds.
# UNVERIFIED: no tag has been built on jitpack.io yet, so the coordinates JitPack serves it under
# (JitPack normally rewrites the group to com.github.<user>...) are unconfirmed; read the tag's build
# log on jitpack.io before pointing a consumer at it. See docs/solver-library.md.
jdk:
  - openjdk21
install:
  # The wrapper is committed executable (git mode 100755); the chmod guards checkouts that drop it.
  - chmod +x ./gradlew
  - ./gradlew -p solver-core publishToMavenLocal
