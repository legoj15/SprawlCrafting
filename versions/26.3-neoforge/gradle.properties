minecraft_version=26.3
minecraft_version_range=[26.3.0,26.4)
# 26.1+ requires the Java 25 toolchain.
java_version=25

# NeoForge (26.3 line). neoforge_version is only the BUILD pin; the shipped requirement is
# neoforge_version_range. 26.3 is the first 26.x line with STABLE (non -beta) NeoForge builds.
neoforge_version=26.3.0.99
neoforge_version_range=[26.3.0,26.4)
neoforge_loader_version_range=[2,)

# JEI 31 for the 26.3 line (maven.blamejared.com). No REI build for the 26.x line.
jei_version=31.17.0.93
