minecraft_version=26.3
minecraft_version_range=[26.3.0,26.4)
# 26.1+ requires the Java 25 toolchain.
java_version=25

# NeoForge (26.3 line). neoforge_version is only the BUILD pin; the shipped requirement is
# neoforge_version_range. 26.3 is the first 26.x line with STABLE (non -beta) NeoForge builds.
neoforge_version=26.3.0.99
neoforge_version_range=[26.3.0,26.4)
neoforge_loader_version_range=[2,)

# JEI 31 for the 26.3 line (maven.blamejared.com). No REI build for the 26.x line.
jei_version=31.17.0.93

# Sophisticated Core / Storage / Backpacks (official NeoForge builds, Modrinth Maven group maven.modrinth, artifact =
# project id nmoqTijg / hMlaZH8f / TyCTlI4b). Setting sophisticated_core_version compiles compat/sophisticated and the
# controller's `sophisticated` constant; -Psc.sophisticated=true adds the three to the dev runtime.
sophisticated_core_version=26.3-1.5.36.2476
sophisticated_storage_version=26.3-1.5.132.2231
sophisticated_backpacks_version=26.3-3.26.20.2252
