minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# MC 1.20.1 targets Java 17 (same as 1.20.1-fabric). The mixin config's compatibilityLevel is lowered to
# JAVA_17 for this node by the shared gradle/legacy-node.gradle.kts.
java_version=17

# Parchment param-name mappings for 1.20.1 (same pin as 1.20.1-fabric).
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# TOOLCHAIN TRAP (first Mavenizer run on a machine): FG7's Mavenizer recompiles Forge 47 with the FIRST
# JDK 17 it finds (env JAVA_HOME_17_X64, then Gradle-provisioned JDKs, then standard install paths).
# JDK 17.0.1's javac rejects valid MC 1.20.1 records ("invalid accessor method in record" in Holder$Direct,
# OptionInstance, MemoryCondition) and the configure step fails. Point JAVA_HOME_17_X64 at a newer JDK 17
# (17.0.21 verified) for that run; the result is cached globally in ~/.gradle/caches/minecraftforge.

# MinecraftForge 47 (NOT NeoForge). forge_version is only the BUILD pin (47.4.29 = latest 1.20.1 build,
# 47.4.28 = recommended, 2026-11-08); the shipped requirement is forge_version_range. Forge 1.20.1 runs
# SRG names at runtime, so build.forge.gradle.kts reobfuscates this node's jar with Renamer.
forge_version=47.4.29
forge_version_range=[47.1.0,48)
# FML language-provider version (Forge's "loader" version is its major number).
forge_loader_version_range=[47,)

# JEI 15 is the 1.20.1 line (maven.blamejared.com), same build as 1.20.1-fabric. No REI build for Forge,
# and Mod Menu is Fabric-only: rei_version / modmenu_version stay unset, which excludes both integrations.
jei_version=15.74.0.234
# mods.toml optional-dependency range for JEI on this line.
jei_version_range=[15,)
# JEI 15.74 hard-depends on mezz_config (ships it jar-in-jar, SRG). The dev runtime needs a renamed copy
# (build.forge.gradle.kts, dev runtime only); same pin as 1.20.1-fabric.
mezz_config_version=0.6.10

# MixinExtras (the shared RecipeButtonMixin uses @WrapOperation). Forge 47.4.29 does NOT bundle it (its
# installer's library list has Mixin 0.8.5 only), so this node jar-in-jars it, like 1.21.1-forge.
mixinextras_version=0.5.0

# Sophisticated Core / Storage / Backpacks (Modrinth Maven, group maven.modrinth, artifact = project id nmoqTijg /
# hMlaZH8f / TyCTlI4b). One SRG-named 1.20.1 jar per mod serves Forge and NeoForge 1.20.1, so build.forge.gradle.kts
# renames them like JEI's. Setting the three pins compiles compat/sophisticated and the controller's `sophisticated`
# constant; -Psc.sophisticated=true adds the three to the dev runtime. Core wants JEI >= 15.20, met by the pin above,
# so unlike 1.21.1-neoforge there is no separate sophisticated_jei_version.
sophisticated_core_version=1.20.1-1.5.33.2475
sophisticated_storage_version=1.20.1-1.5.17.2230
sophisticated_backpacks_version=1.20.1-3.26.20.2248

# Applied Energistics 2 (optional; issue #27): compile only, so compat/ae2 — the Crafting Terminal as a
# crafting station — compiles against AE2's last MinecraftForge line (15.4.12). One SRG-named jar from the
# Modrinth maven (group maven.modrinth, artifact = project id "ae2"), renamed to dev names by
# build.forge.gradle.kts exactly like JEI's and Sophisticated's. The source is authored against AE2 19
# (1.21.1-neoforge) and //?-branched on >=1.20.5 for this line's API differences (no link status, no
# getEnergySource, hasTag for hasComponents).
# PINNED BY MODRINTH VERSION ID, not "15.4.12": AE2 publishes Fabric and Forge under the same version
# number and the bare number resolves to the FABRIC jar (intermediary names, ItemVariant). QRpVsqDI =
# appliedenergistics2-forge-15.4.12.jar.
ae2_version=QRpVsqDI
