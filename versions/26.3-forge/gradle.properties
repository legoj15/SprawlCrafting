minecraft_version=26.3
minecraft_version_range=[26.3.0,26.4)
# 26.1+ requires the Java 25 toolchain (Forge 62+ "requires Java 25").
java_version=25

# MinecraftForge (NOT NeoForge), 26.3 line = Forge 66.x. forge_version is only the BUILD pin (the
# newest 26.3 build); the shipped requirement is forge_version_range. 66.1.0 is Forge's recommended build.
forge_version=66.1.5
forge_version_range=[66.1.0,67)
# FML language-provider version range (the javafml provider ships with the Forge version, so it is the major number, as on 1.21.1).
forge_loader_version_range=[66,)

# No Parchment / JEI / REI / Mod Menu: see versions/26.1.2-forge/gradle.properties.
