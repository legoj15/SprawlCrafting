minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
java_version=21

# Parchment param-name mappings (1.21.1 line only; 26.x runs pure Mojmap)
parchment_minecraft=1.21
parchment_version=2024.11.10

# MinecraftForge (NOT NeoForge). forge_version is only the BUILD pin (latest 1.21.1 build; Forge's
# "recommended" is 52.1.20); the shipped requirement is forge_version_range. 52.1.0 is the first
# non-0.x build of the 52 line, which is when the payload-channel networking this mod uses settled.
forge_version=52.1.21
forge_version_range=[52.1.0,53)
# FML language-provider version (Forge's "loader" version is its major number).
forge_loader_version_range=[52,)

# JEI (optional integration; resolves from maven.blamejared.com). Same pin as the other 1.21.1
# nodes. No REI build exists for Forge 1.21.1 and Mod Menu is Fabric-only, so neither is declared
# here: leaving rei_version / modmenu_version unset is what excludes those integrations.
jei_version=19.27.0.340
# mods.toml optional-dependency range for JEI on this line.
jei_version_range=[19,)

# MixinExtras (the shared RecipeButtonMixin uses @WrapOperation). Fabric Loader and NeoForge bundle it;
# Forge 1.21.1 does NOT, so this node jar-in-jars it (see build.forge.gradle.kts).
mixinextras_version=0.5.0
