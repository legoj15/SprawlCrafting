minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
java_version=21

# Parchment param-name mappings (1.21.1 line only; 26.x runs pure Mojmap)
parchment_minecraft=1.21
parchment_version=2024.11.10

# NeoForge. neoforge_version is only the BUILD pin; the shipped requirement is
# neoforge_version_range (compile-probed green against 21.1.1, the earliest 21.1.x build;
# the mixin targets are vanilla 1.21.1 classes, identical across the branch).
neoforge_version=21.1.233
neoforge_version_range=[21.1.0,21.2)
neoforge_loader_version_range=[4,)

# JEI (optional integration; resolves from maven.blamejared.com)
jei_version=19.27.0.340

# REI (optional integration; resolves from maven.shedaniel.me) — 1.21.1 line only
rei_version=16.0.799

# Applied Energistics 2 (optional integration, compile-only; resolves from api.modrinth.com/maven).
# Its Crafting Terminal counts as a crafting station (issue #2); compat/ae2 compiles only where this
# is set. guideme_version is AE2's hard runtime dependency, used only for -Psc.ae2=true dev runs.
ae2_version=19.2.19
guideme_version=21.1.15
# Sophisticated Core / Storage / Backpacks (official NeoForge builds, Modrinth Maven group maven.modrinth, artifact =
# project id nmoqTijg / hMlaZH8f / TyCTlI4b). Setting sophisticated_core_version compiles compat/sophisticated and the
# controller's `sophisticated` constant; -Psc.sophisticated=true adds the three to the dev runtime.
sophisticated_core_version=1.21.1-1.5.35.2473
sophisticated_storage_version=1.21.1-1.6.18.2229
sophisticated_backpacks_version=1.21.1-3.26.21.2249
# Sophisticated Core requires JEI >= 19.32.0.359 when JEI is present, newer than the compile pin above; the
# -Psc.sophisticated=true dev runtime uses this build instead. 19.39.0.372 is the newest JEI that still loads on
# the NeoForge pin above (19.42 and later require NeoForge 21.1.238).
sophisticated_jei_version=19.39.0.372
