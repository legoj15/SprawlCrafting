minecraft_version=26.2
minecraft_version_range=[26.2.0,26.3)
# 26.1+ requires the Java 25 toolchain (Forge 62+ "requires Java 25").
java_version=25

# MinecraftForge (NOT NeoForge), 26.2 line = Forge 65.x. forge_version is only the BUILD pin (the
# newest 26.2 build); the shipped requirement is forge_version_range. 65.1.0 is the first build of the
# "65.1" stabilisation line (Forge's recommended build is 65.1.5).
forge_version=65.1.6
forge_version_range=[65.1.0,66)
# FML language-provider version range (the javafml provider ships with the Forge version, so it is the major number, as on 1.21.1).
forge_loader_version_range=[65,)

# No Parchment / JEI / REI / Mod Menu: see versions/26.1.2-forge/gradle.properties.
#
# WARNING (same caveat as versions/26.2-neoforge): the recipe-book mixin targets were javap-checked
# against this node's PINNED MC build only, not across the whole 26.2 line.
