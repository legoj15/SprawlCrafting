minecraft_version=26.3
minecraft_version_range=[26.3.0,26.4)
# 26.1+ requires the Java 25 toolchain.
java_version=25

# Fabric (26.3 line). fabric-api 0.165.0+26.3 is the newest +26.3 build (the 0.164.x/0.165.x +26.4
# builds target the 26.4 snapshots). Its fabric.mod.json requires fabricloader >=0.19.3, so the loader
# pin stays at 0.19.3 like the other 26.x fabric nodes (0.20.1 is the current stable; the floor is what
# matters for the shipped requirement).
fabric_loader_version=0.19.3
fabric_version=0.165.0+26.3

# 26.x is pure Mojmap — NO parchment_minecraft / parchment_version.

# JEI 31 for the 26.3 line (maven.blamejared.com, coordinate jei-26.3-*), same build as 26.3-neoforge.
# No REI build for the 26.x line -> rei_version intentionally UNSET.
jei_version=31.17.0.93

# Mod Menu 21.0.0 is the stable 26.3 release (Modrinth game-version filter: 21.0.0 + 21.0.0-beta.1 are
# the only 26.3-tagged builds; maven's 22.0.0-alpha.* are 26.4-snapshot builds). compileOnly API.
modmenu_version=21.0.0
