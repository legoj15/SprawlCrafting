minecraft_version=26.1.2
minecraft_version_range=[26.1.0,26.2)
# 26.1+ requires the Java 25 toolchain (Forge 62+ "requires Java 25").
java_version=25

# MinecraftForge (NOT NeoForge), 26.1.2 line = Forge 64.x. forge_version is only the BUILD pin (the
# newest 26.1.2 build); the shipped requirement is forge_version_range. 64.1.0 is the first build of the
# "64.1" stabilisation line (Forge's recommended build is 64.1.5), which is what this node is verified on.
forge_version=64.1.6
forge_version_range=[64.1.0,65)
# FML language-provider version range (the javafml provider ships with the Forge version, so it is the major number, as on 1.21.1).
forge_loader_version_range=[64,)

# No Parchment (none exists for 26.x: pure Mojmap), no JEI (no Forge build of JEI exists for 26.x),
# no REI, no Mod Menu: leaving parchment_*, jei_version, rei_version and modmenu_version unset is what
# excludes those integrations from this node.
