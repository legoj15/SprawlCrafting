minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.20.2)
# MC 1.20.1 targets Java 17 (the vanilla launcher bundles Java 17 for this line). The shared source
# therefore avoids Java 21-only language/library features (pattern-matching switch, SequencedCollection).
java_version=17

# Parchment param-name mappings for 1.20.1.
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric (1.20.1 line). fabric-api is the newest 0.92.x build on maven.fabricmc.net (verified
# 2026-11-08). The loader floor is set by what the dev runtime must load: fabric-api 0.92.12 needs
# >=0.16.10 and JEI 15.74 needs >=0.19.4 (runServer/runClient fail mod resolution on 0.16.9).
fabric_version=0.92.12+1.20.1
fabric_loader_version=0.19.4
# The fabricloader floor written into fabric.mod.json: fabric-api 0.92.12's own minimum. Players without
# JEI 15.74 don't need the dev pin's 0.19.4 (JEI enforces its own loader floor when present).
fabric_loader_min=0.16.10

# JEI 15 is the 1.20.1 line (maven.blamejared.com).
jei_version=15.74.0.234
# JEI 15.74 hard-depends on mezz_config (>=0.6.10 <1.0.0). It ships jar-in-jar inside JEI for players,
# but the Loom dev runtime needs it added explicitly (build.fabric-o.gradle.kts, dev runtime only).
mezz_config_version=0.6.10

# REI 12 is the 1.20.1 line (maven.shedaniel.me).
rei_version=12.1.785

# Mod Menu 7.x is the 1.20.1 line (maven.terraformersmc.com); compileOnly, the player supplies it.
modmenu_version=7.2.2
