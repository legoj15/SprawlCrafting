// =====================================================================================
// SprawlCrafting :: legacy Minecraft 1.16.5 (Forge + Fabric) — root of a SELF-CONTAINED build.
//
// Kept outside the modern Stonecutter tree (like forge-1.12.2/) because 1.16.5 needs Java 8 bytecode
// and its own loader toolchains: ForgeGradle 7 (:forge) and Fabric Loom remap (:fabric), both on this
// build's Gradle 9.5 wrapper, host JDK 21 (use ./gw.sh or gw.ps1). Shared sources:
//   common/src/main/java       — all 1.16.5 game logic, client UI, mixins (Forge 1.16.5 naming)
//   ../solver-core             — the Minecraft-free planner + its JUnit suite (run on Java 8)
// See docs/legacy-1.16.5.md for the toolchain notes and traps.
// =====================================================================================
plugins {
    id 'net.minecraftforge.gradle' version '7.0.40' apply false
    id 'net.minecraftforge.renamer' version '1.1.8' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17.8' apply false
}

// SINGLE SOURCE OF TRUTH for the mod version, repo-wide: the root gradle.properties two levels up.
ext.modVersion = {
    def p = new Properties()
    file('../gradle.properties').withInputStream { p.load(it) }
    def v = p.getProperty('version')
    if (!v?.trim()) {
        throw new GradleException("No 'version' in ../gradle.properties — the 1.16.5 build reads the mod version from there.")
    }
    return v.trim()
}()
