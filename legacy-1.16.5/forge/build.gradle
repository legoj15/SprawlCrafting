// =====================================================================================
// SprawlCrafting :: Minecraft 1.16.5 Forge (ForgeGradle 7 + Renamer, Java 8 bytecode)
//
// FG7 runs on this build's Gradle 9.5 wrapper; its Mavenizer builds the 1.16.5 Forge artifact with
// "official" mappings — which for 1.16.x means MCP/SRG CLASS names + Mojang MEMBER names. Production
// 1.16.5 runs SRG names, so the jar is renamed (named -> SRG) by the Renamer plugin, which also
// rewrites the Mixin refmap to SRG (func_/field_). Forge 1.16.5 bundles Mixin 0.8.4 and loads our
// config from the jar manifest's MixinConfigs attribute.
// =====================================================================================
plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
    id 'net.minecraftforge.renamer'
}

def rootVersion = rootProject.ext.modVersion
version = rootVersion
group = 'com.legoj15.sprawlcrafting'
base.archivesName = 'sprawlcrafting'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

sourceSets {
    main {
        java {
            srcDir '../common/src/main/java'
        }
        resources {
            srcDir '../common/src/main/resources'
        }
    }
    // Minecraft-free unit tests of shared logic (StationDraw). Run once, here: Forge's toolchain already
    // compiles common/ as Java 8, and the classes under test are identical on Fabric.
    test {
        java {
            srcDir '../common/src/test/java'
        }
    }
}

// The solver library (com.legoj15:solver, a composite build). Forge 36 has no jar-in-jar, so its classes
// are SHADED into the jar. Fine here: the shading-forbidden case (two mods nesting the same JPMS module)
// needs JarJar-era Forge; nothing else targets this version with the library.
configurations {
    shade
    implementation.extendsFrom shade
}

renamer.enableMixinRefmaps {
    config 'sprawlcrafting.mixins.json'
    refMap = 'sprawlcrafting.refmap.json'
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            // Dev runs load classes from the build dirs, not a jar, so the MixinConfigs manifest
            // attribute is invisible there: name the config explicitly.
            args '-mixin.config=sprawlcrafting.mixins.json', '-mixin.config=sprawlcrafting.jei.mixins.json'
        }
        register('client') {}
        register('server') {
            workingDir = layout.projectDirectory.dir('run-server')
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
    // AE2's own maven: appeng:appliedenergistics2 is the Forge jar on the 1.16 line (AE2 for Fabric 1.16 was
    // a separate artifact), so unlike Modrinth's pin on 1.20.1 it cannot resolve to a Fabric jar.
    maven { url = 'https://modmaven.dev/'; content { includeGroup 'appeng' } }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI API (SRG-named in its published jar) renamed to our dev names; compile-only soft dependency.
    compileOnly renamer.dependency("mezz.jei:jei-1.16.5:${jei_version}:api")
    // -Pjei pulls the full JEI into dev runs (runClient) for manual testing.
    if (project.hasProperty('jei')) {
        runtimeOnly renamer.dependency("mezz.jei:jei-1.16.5:${jei_version}")
    }

    // AE2 (SRG-named in its published jar) renamed to our dev names; compile-only soft dependency for
    // compat/ae2, which loads only when AE2 does (StationStorages.bootstrap).
    // One renamed artifact for both configurations: a second renamer.dependency() of the same coordinate is
    // a second rename task writing the same file, which Gradle rejects as an undeclared dependency.
    // AE2's published jar is signed, and renaming rewrites its classes but keeps META-INF's signature, so a
    // dev run dies on "SHA-256 digest error" when ModLauncher verifies the jar: strip the signature after
    // renaming (an unsigned jar is not verified). Dev-only artifact; nothing of AE2 is shipped.
    def ae2 = renamer.dependency("appeng:appliedenergistics2:${ae2_version}") { rename ->
        rename.doLast {
            def jar = rename.output.get().asFile.toPath()
            def zip = java.nio.file.FileSystems.newFileSystem(jar, (ClassLoader) null)
            try {
                def metaInf = zip.getPath('META-INF')
                if (!java.nio.file.Files.isDirectory(metaInf)) {
                    return // unsigned jar, nothing to strip
                }
                java.nio.file.Files.list(metaInf).withCloseable { entries ->
                    entries.filter { it.fileName.toString() ==~ /(?i).+\.(SF|RSA|DSA|EC)/ }
                            .collect(java.util.stream.Collectors.toList())
                            .each { java.nio.file.Files.delete(it) }
                }
            } finally {
                zip.close()
            }
        }
    }
    compileOnly ae2
    // -Pae2 pulls AE2 into dev runs for manual testing (combine with -Pjei for the terminal's JEI button).
    if (project.hasProperty('ae2')) {
        runtimeOnly ae2
    }

    shade "com.legoj15:solver:${rootProject.ext.solverVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
renamer.mappings(minecraft.dependency.toSrg)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    def props = [version: rootVersion, minecraft_version: minecraft_version]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') { expand(props) }
}

tasks.named('jar', Jar) {
    archiveVersion = "${rootVersion}+mc${minecraft_version}-forge"
    archiveClassifier = 'dev'
    // Shade the solver library's classes (not its manifest) into the jar Renamer turns into the release jar.
    from(configurations.shade.elements.map { files -> files.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }
    manifest {
        attributes([
                'MixinConfigs'          : 'sprawlcrafting.mixins.json,sprawlcrafting.jei.mixins.json',
                'Specification-Title'   : 'sprawlcrafting',
                'Specification-Vendor'  : 'legoj15',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'SprawlCrafting',
                'Implementation-Version': rootVersion,
                'Implementation-Vendor' : 'legoj15'
        ])
    }
}

// The production jar: named -> SRG classes + the SRG refmap. sprawlcrafting-<ver>+mc1.16.5-forge.jar
renamer.classes(tasks.named('jar', Jar)) {
    // RenameJar is not an archive task (no archiveVersion): name the output file directly.
    archiveClassifier = ''
    output = layout.buildDirectory.file("libs/sprawlcrafting-${rootVersion}+mc${minecraft_version}-forge.jar")
    mappings renamer.mixin.generatedMappings
    // The Renamer tool otherwise writes a fernflower_abstract_parameter_names.txt (a decompiler aid)
    // into the shipped jar; --disable-abstract-param stops it collecting that file.
    additionalArgs.add('--disable-abstract-param')
}
tasks.named('assemble') { dependsOn 'renameJar' }
